# Krate Dispatcharr — core uWSGI (gevent) aligned with docker/uwsgi.ini.
# Paths, http bind, attach-daemon and exec-pre are passed from bin/krate-run.sh.
[uwsgi]
master = true
module = dispatcharr.wsgi:application
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
workers = 4
gevent = 400
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch
lazy-apps = true
http-keepalive = 1
buffer-size = 65536
post-buffering = 4096
http-timeout = 600
socket-timeout = 600
vacuum = true
die-on-term = true
thunder-lock = true
log-4xx = true
log-5xx = true
disable-logging = true
