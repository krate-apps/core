id: lingarr
multi_user: true
runtime:
  kind: systemd
  service_template: lingarr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates wget build-essential python3
install:
  release:
    branches:
      main: main
      beta: main
  layout:
    backup_dir: /home/%i/.krate/backups/lingarr
    data_dir: /home/%i/.config/lingarr
    install_dir: /opt/%i/lingarr
    temp_dir: /home/%i/tmp/lingarr
  executable:
    - /opt/%i/lingarr/Lingarr.Server
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/lingarr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/lingarr
      HOME: /home/%i
      DOTNET_ROOT: /usr/share/dotnet
      PATH: /usr/share/dotnet:/usr/local/bin:/usr/bin:/bin
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /home/%i/tmp/lingarr
    file:
      path: /home/%i/.krate/applications/lingarr.env
      mode: "0600"
      variables:
        ASPNETCORE_URLS: "http://127.0.0.1:{default_port}"
        ASPNETCORE_ENVIRONMENT: Production
        DB_CONNECTION: sqlite
        SQLITE_DB_PATH: /home/%i/.config/lingarr/local.db
        DB_HANGFIRE_SQLITE_PATH: /home/%i/.config/lingarr/Hangfire.db
        BASE_PATH: "{url_base}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/lingarr /home/%i/.config/lingarr
    start:
      - /opt/%i/lingarr/Lingarr.Server
files:
  service: /etc/systemd/system/lingarr@.service
  config:
    - /home/%i/.krate/applications/lingarr.env
    - /home/%i/.config/lingarr/local.db
  proxy:
    - /etc/caddy/softwares/%i.lingarr.caddy
  binary:
    - /opt/%i/lingarr/Lingarr.Server
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/lingarr
      - /home/%i/tmp/lingarr
      - /home/%i/.krate/backups/lingarr
      - /home/%i/.krate/applications
      - /home/%i/.nuget
      - /home/%i/.npm
      - /opt/%i/lingarr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/Lingarr.Server.dll"
