id: lazylibrarian
multi_user: true
runtime:
  kind: systemd
  service_template: lazylibrarian@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates python3 build-essential
install:
  release:
    branches:
      main: master
      beta: master
  layout:
    backup_dir: /home/%i/.krate/backups/lazylibrarian
    data_dir: /home/%i/.config/lazylibrarian
    install_dir: /opt/%i/lazylibrarian
    temp_dir: /home/%i/tmp/lazylibrarian
  executable:
    - /opt/%i/lazylibrarian/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/lazylibrarian
  environment:
    inline:
      TMPDIR: /home/%i/tmp/lazylibrarian
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/lazylibrarian.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/lazylibrarian /home/%i/.config/lazylibrarian /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/lazylibrarian/.venv/bin/python
      - /opt/%i/lazylibrarian/LazyLibrarian.py
      - --nolaunch
      - --datadir
      - /home/%i/.config/lazylibrarian
      - --config
      - /home/%i/.config/lazylibrarian/config.ini
      - --port
      - ${PORT}
files:
  service: /etc/systemd/system/lazylibrarian@.service
  config:
    - /home/%i/.config/lazylibrarian/config.ini
    - /home/%i/.krate/applications/lazylibrarian.env
  database:
    - /home/%i/.config/lazylibrarian/lazylibrarian.db
  proxy:
    - /etc/caddy/softwares/%i.lazylibrarian.caddy
  binary:
    - /opt/%i/lazylibrarian/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/lazylibrarian
      - /home/%i/tmp/lazylibrarian
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/lazylibrarian
      - /home/%i/.krate/applications
      - /opt/%i/lazylibrarian/.venv
    read_only:
      - /opt/%i/lazylibrarian
version:
  probes:
    - type: file
      path: "{install_dir}/LazyLibrarian.py"
    - type: file
      path: "{install_dir}/.venv/bin/python"
