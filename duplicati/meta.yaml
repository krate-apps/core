id: duplicati
name: Duplicati
description: "Encrypted backup client with a web UI for local and cloud storage."
links:
  homepage: https://www.duplicati.com/
  documentation: https://docs.duplicati.com/
  source: https://github.com/duplicati/duplicati
  krate_docs: https://runkrate.com/docs/software/official/duplicati
tier: pro
category: cloud
install_mode: local
password_constraints:
  min_length: 8
  max_length: 128
  require_upper: false
  require_digit: false
autocomplete_options:
  - -b
ui_options:
  branches:
    options:
      - main
      - beta
    label: app.branch
