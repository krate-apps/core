id: cleanuparr
multi_user: true
runtime:
  kind: systemd
  service_template: cleanuparr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/cleanuparr
    data_dir: /home/%i/.config/cleanuparr
    install_dir: /opt/%i/cleanuparr
    temp_dir: /home/%i/tmp/cleanuparr
  release:
    asset: linux-amd64.zip
  executable:
    - /opt/%i/cleanuparr/Cleanuparr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/cleanuparr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/cleanuparr
    file:
      path: /home/%i/.krate/applications/cleanuparr.env
      mode: "0600"
      variables:
        BIND_ADDRESS: 127.0.0.1
        PORT: "{default_port}"
        BASE_PATH: "{url_base}"
        CLEANUPARR_CONFIG_PATH: /home/%i/.config/cleanuparr/config
        CLEANUPARR_LOGS_PATH: /home/%i/.config/cleanuparr/logs
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/cleanuparr /home/%i/.config/cleanuparr/config /home/%i/.config/cleanuparr/logs
    start:
      - /opt/%i/cleanuparr/Cleanuparr
files:
  service: /etc/systemd/system/cleanuparr@.service
  config:
    - /home/%i/.krate/applications/cleanuparr.env
  proxy:
    - /etc/caddy/softwares/%i.cleanuparr.caddy
  binary:
    - /opt/%i/cleanuparr/Cleanuparr
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/cleanuparr
      - /home/%i/tmp/cleanuparr
      - /home/%i/.krate/backups/cleanuparr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/cleanuparr
version:
  probes:
    - type: file
      path: "{install_dir}/Cleanuparr"
