id: komga
multi_user: true
runtime:
  kind: systemd
  service_template: komga@.service
dependencies:
  apt:
    common:
      packages: openjdk-17-jre-headless curl ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/komga
    data_dir: /home/%i/.config/komga
    install_dir: /opt/%i/komga
    temp_dir: /home/%i/tmp/komga
  release:
    # Matches komga-<version>.jar (e.g. komga-1.26.3.jar); avoid bare ".jar".
    asset: komga-
  executable:
    - /opt/%i/komga/komga-run
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/komga
  environment:
    inline:
      TMPDIR: /home/%i/tmp/komga
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/komga.env
      mode: "0600"
      variables:
        KOMGA_PORT: "{default_port}"
        KOMGA_CONFIG_DIR: /home/%i/.config/komga
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/komga /home/%i/.config/komga
    start:
      - /opt/%i/komga/komga-run
files:
  service: /etc/systemd/system/komga@.service
  config:
    - /home/%i/.krate/applications/komga.env
  proxy:
    - /etc/caddy/softwares/%i.komga.caddy
  binary:
    - /opt/%i/komga/komga.jar
    - /opt/%i/komga/komga-run
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/komga
      - /home/%i/tmp/komga
      - /home/%i/.krate/backups/komga
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/komga
version:
  probes:
    - type: file
      path: "{install_dir}/komga.jar"
