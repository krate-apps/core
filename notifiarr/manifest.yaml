id: notifiarr
multi_user: true
runtime:
  kind: systemd
  service_template: notifiarr@.service
dependencies:
  apt:
    common:
      packages: smartmontools
install:
  layout:
    backup_dir: /home/%i/.krate/backups/notifiarr
    data_dir: /home/%i/.config/notifiarr
    install_dir: /opt/%i/notifiarr
    temp_dir: /home/%i/tmp/notifiarr
  release:
    asset: notifiarr.amd64.linux.gz
  executable:
    - /opt/%i/notifiarr/notifiarr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/notifiarr
      DN_QUIET: "true"
      DN_LOG_FILE: /home/%i/.config/notifiarr/logs/app.log
      DN_HTTP_LOG: /home/%i/.config/notifiarr/logs/http.log
      DN_DEBUG_LOG: /home/%i/.config/notifiarr/logs/debug.log
      DN_SERVICES_LOG_FILE: /home/%i/.config/notifiarr/logs/services.log
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/notifiarr /home/%i/.config/notifiarr/logs
    start:
      - /opt/%i/notifiarr/notifiarr
      - --config=/home/%i/.config/notifiarr/notifiarr.conf
files:
  service: /etc/systemd/system/notifiarr@.service
  config:
    - /home/%i/.config/notifiarr/notifiarr.conf
  proxy:
    - /etc/caddy/softwares/%i.notifiarr.caddy
  binary:
    - /opt/%i/notifiarr/notifiarr
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/notifiarr
      - /home/%i/tmp/notifiarr
      - /home/%i/.krate/backups/notifiarr
    read_only:
      - /opt/%i/notifiarr
version:
  probes:
    - type: executable
      cmd: "{install_dir}/notifiarr"
      args: version
      requires: active
