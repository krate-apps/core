id: quassel
multi_user: true
runtime:
  kind: systemd
  service_template: quassel@.service
dependencies:
  apt:
    common:
      packages: quassel-core ca-certificates openssl
install:
  layout:
    backup_dir: /home/%i/.krate/backups/quassel
    data_dir: /home/%i/.config/quassel
    install_dir: /opt/%i/quassel
    temp_dir: /home/%i/tmp/quassel
  executable:
    - /usr/bin/quasselcore
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/quassel
  environment:
    inline:
      TMPDIR: /home/%i/tmp/quassel
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/quassel.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/quassel /home/%i/.config/quassel
    start:
      - /usr/bin/quasselcore
      - --configdir=/home/%i/.config/quassel
      - --listen=127.0.0.1
      - --port=${PORT}
files:
  service: /etc/systemd/system/quassel@.service
  config:
    - /home/%i/.krate/applications/quassel.env
  binary:
    - /usr/bin/quasselcore
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/quassel
      - /home/%i/tmp/quassel
      - /home/%i/.krate/backups/quassel
      - /home/%i/.krate/applications
      - /opt/%i/quassel
    read_only: []
version:
  probes:
    - type: executable
      cmd: /usr/bin/quasselcore
      args: --version
      requires: active
