id: pyload
multi_user: true
runtime:
  kind: systemd
  service_template: pyload@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates python3 build-essential unrar
install:
  layout:
    backup_dir: /home/%i/.krate/backups/pyload
    data_dir: /home/%i/.config/pyload
    install_dir: /opt/%i/pyload
    temp_dir: /home/%i/tmp/pyload
  executable:
    - /opt/%i/pyload/.venv/bin/pyload
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/pyload
  environment:
    inline:
      TMPDIR: /home/%i/tmp/pyload
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/pyload.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/pyload /home/%i/.config/pyload /home/%i/.config/pyload/downloads /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/pyload/.venv/bin/pyload
      - --userdir
      - /home/%i/.config/pyload
      - --tempdir
      - /home/%i/tmp/pyload
      - --storagedir
      - /home/%i/.config/pyload/downloads
files:
  service: /etc/systemd/system/pyload@.service
  config:
    - /home/%i/.config/pyload/settings/pyload.cfg
    - /home/%i/.krate/applications/pyload.env
  proxy:
    - /etc/caddy/softwares/%i.pyload.caddy
  binary:
    - /opt/%i/pyload/.venv/bin/pyload
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/pyload
      - /home/%i/tmp/pyload
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/pyload
      - /home/%i/.krate/applications
      - /opt/%i/pyload/.venv
    read_only:
      - /opt/%i/pyload
version:
  probes:
    - type: pip
      venv: "{install_dir}/.venv"
      package: pyload-ng
    - type: executable
      cmd: "{install_dir}/.venv/bin/pyload"
      args: --version
      requires: active
