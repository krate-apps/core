id: homepage
multi_user: true
runtime:
  kind: systemd
  service_template: homepage@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates build-essential python3
install:
  release:
    branches:
      main: main
      beta: dev
  layout:
    backup_dir: /home/%i/.krate/backups/homepage
    data_dir: /home/%i/.config/homepage
    install_dir: /opt/%i/homepage
    temp_dir: /home/%i/tmp/homepage
  executable:
    - /usr/local/bin/pnpm
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/homepage
  environment:
    inline:
      TMPDIR: /home/%i/tmp/homepage
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
      HOMEPAGE_CONFIG_DIR: /home/%i/.config/homepage
    file:
      path: /home/%i/.krate/applications/homepage.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        HOSTNAME: "127.0.0.1"
        HOST: "127.0.0.1"
        HOMEPAGE_CONFIG_DIR: /home/%i/.config/homepage
        HOMEPAGE_ALLOWED_HOSTS: "*"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/homepage /home/%i/.local/share/pnpm /home/%i/.config/homepage
    start:
      - /usr/local/bin/pnpm
      - exec
      - next
      - start
      - -H
      - "127.0.0.1"
      - -p
      - ${PORT}
files:
  service: /etc/systemd/system/homepage@.service
  config:
    - /home/%i/.krate/applications/homepage.env
  proxy:
    - /etc/caddy/softwares/%i.homepage.caddy
  binary:
    - /usr/local/bin/pnpm
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/homepage
      - /home/%i/tmp/homepage
      - /home/%i/.krate/backups/homepage
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/homepage
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/package.json"
      field: version
    - type: http
      url: "http://127.0.0.1:{default_port}/api/healthcheck"
      requires: active
