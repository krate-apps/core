id: thelounge
name: The Lounge
description: "Self-hosted web IRC client (npm install; private mode on loopback)."
links:
  homepage: https://thelounge.chat/
  documentation: https://thelounge.chat/docs
  source: https://github.com/thelounge/thelounge
  krate_docs: https://krate.github.io/docs/software/official/thelounge
tier: free
category: network
install_mode: local
password_constraints:
  min_length: 8
  max_length: 128
  require_upper: false
  require_digit: false
autocomplete_options:
  - -b
ui_options:
  branches:
    - main
    - beta
