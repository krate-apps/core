id: nextcloud
multi_user: true
# Served by a per-user PHP-FPM pool (krate-nextcloud-{user}.sock) via Caddy php_subpath.
# No php -S unit — HTTP is FPM + Caddy; occ remains CLI. Cron uses AJAX background mode.
proxy:
  mode: php_subpath
  app_auth: true
  document_root: /opt/%i/nextcloud
dependencies:
  apt:
    common:
      packages: >-
        php8.5-fpm php8.5-cli php8.5-sqlite3 php8.5-curl php8.5-gd php8.5-xml
        php8.5-mbstring php8.5-zip php8.5-intl php8.5-bcmath unzip curl
        ca-certificates
install:
  release:
    # Stable: latest.tar.bz2 via url: index (release::get). Beta prereleases need
    # newest-match listing (CDN index is ascending); handler keeps minimal curl there.
    base: https://download.nextcloud.com/server/releases/
    asset: latest.tar.bz2
    branches:
      main: release
      beta: prerelease
  layout:
    backup_dir: /home/%i/.krate/backups/nextcloud
    data_dir: /home/%i/.config/nextcloud
    install_dir: /opt/%i/nextcloud
    temp_dir: /home/%i/.tmp/nextcloud
  executable:
    - /usr/bin/php
systemd: {}
files:
  config:
    - /home/%i/.config/nextcloud/config/config.php
    - /home/%i/.krate/applications/nextcloud.env
  database:
    - /home/%i/.config/nextcloud/data
  proxy:
    - /etc/caddy/softwares/%i.nextcloud.caddy
  binary:
    - /opt/%i/nextcloud/occ
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/nextcloud
      - /home/%i/.tmp/nextcloud
      - /home/%i/.krate/backups/nextcloud
      - /home/%i/.krate/applications
      - /opt/%i/nextcloud
    read_only: []
version:
  probes:
    - type: file
      path: "{data_dir}/VERSION"
