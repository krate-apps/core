id: tautulli
multi_user: true
runtime:
  kind: systemd
  service_template: tautulli@.service
dependencies:
  apt:
    common:
      packages: git python3.13 python3.13-venv python3.13-dev build-essential
install:
  release:
    branches:
      main: release
      beta: nightly
  layout:
    install_dir: /opt/%i/tautulli
    data_dir: /home/%i/.config/tautulli
    backup_dir: /home/%i/.krate/backups/tautulli
    temp_dir: /home/%i/tmp/tautulli
  executable:
    - /opt/%i/tautulli/Tautulli.py
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "5"
    UMask: "0002"
    WorkingDirectory: /opt/%i/tautulli
  environment:
    inline:
      TMPDIR: /home/%i/tmp/tautulli
      PYTHONUNBUFFERED: "1"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/tautulli /home/%i/.config/tautulli/backups /home/%i/.config/tautulli/cache /home/%i/.config/tautulli/exports /home/%i/.config/tautulli/logs /home/%i/.config/tautulli/newsletters
    start:
      - /opt/%i/tautulli/.venv/bin/python
      - /opt/%i/tautulli/Tautulli.py
      - --quiet
      - --nolaunch
      - --config
      - /home/%i/.config/tautulli/config.ini
      - --datadir
      - /home/%i/.config/tautulli
files:
  service: /etc/systemd/system/tautulli@.service
  config:
    - /home/%i/.config/tautulli/config.ini
  database:
    - /home/%i/.config/tautulli/tautulli.db
  proxy:
    - /etc/caddy/softwares/%i.tautulli.caddy
  binary:
    - /opt/%i/tautulli/Tautulli.py
autogen:
  - apikey
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/tautulli
      - /home/%i/tmp/tautulli
      - /home/%i/.krate/backups/tautulli
    read_only:
      - /opt/%i/tautulli
version:
  probes:
    - type: file
      path: "{install_dir}/VERSION"
