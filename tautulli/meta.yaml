id: tautulli
name: Tautulli
description: "Plex watch statistics and notifications."
links:
  homepage: https://tautulli.com/
  documentation: https://github.com/Tautulli/Tautulli/wiki
  source: https://github.com/Tautulli/Tautulli
  krate_docs: https://runkrate.com/docs/software/official/tautulli
tier: pro
