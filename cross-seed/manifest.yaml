id: cross-seed
multi_user: true
runtime:
  kind: systemd
  service_template: cross-seed@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates build-essential python3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/cross-seed
    data_dir: /home/%i/.config/cross-seed
    install_dir: /opt/%i/cross-seed
    temp_dir: /home/%i/.tmp/cross-seed
  release:
    branches:
      main: release
      beta: master
  executable:
    - /usr/local/bin/pnpm
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/cross-seed
  environment:
    inline:
      TMPDIR: /home/%i/.tmp/cross-seed
      HOME: /home/%i
      NODE_ENV: production
      CONFIG_DIR: /home/%i/.config/cross-seed
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm/bin:/home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/cross-seed.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        CONFIG_DIR: /home/%i/.config/cross-seed
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/cross-seed /home/%i/.config/cross-seed /home/%i/.local/share/pnpm
    start:
      - /opt/%i/cross-seed/node_modules/node/bin/node
      - /opt/%i/cross-seed/node_modules/cross-seed/dist/cmd.js
      - daemon
      - --host
      - "127.0.0.1"
      - -p
      - ${PORT}
files:
  service: /etc/systemd/system/cross-seed@.service
  config:
    - /home/%i/.config/cross-seed/config.js
    - /home/%i/.krate/applications/cross-seed.env
  proxy:
    - /etc/caddy/softwares/%i.cross-seed.caddy
  binary:
    - /usr/local/bin/pnpm
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/cross-seed
      - /home/%i/.tmp/cross-seed
      - /home/%i/.krate/backups/cross-seed
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/cross-seed
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/node_modules/cross-seed/package.json"
      field: version
