id: kometa
multi_user: true
runtime:
  kind: systemd
  service_template: kometa@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates
install:
  release:
    branches:
      main: master
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/kometa
    data_dir: /home/%i/.config/kometa
    install_dir: /opt/%i/kometa
    temp_dir: /home/%i/tmp/kometa
  executable:
    - /opt/%i/kometa/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 120
    Type: simple
    Restart: on-failure
    RestartSec: "30"
    WorkingDirectory: /opt/%i/kometa
  environment:
    inline:
      TMPDIR: /home/%i/tmp/kometa
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/kometa.env
      mode: "0600"
      variables:
        KOMETA_CONFIG: /home/%i/.config/kometa/config/config.yml
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/kometa /home/%i/.config/kometa/config /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/kometa/.venv/bin/python
      - /opt/%i/kometa/kometa.py
      - --config
      - /home/%i/.config/kometa/config/config.yml
files:
  service: /etc/systemd/system/kometa@.service
  config:
    - /home/%i/.config/kometa/config/config.yml
    - /home/%i/.krate/applications/kometa.env
  binary:
    - /opt/%i/kometa/.venv/bin/python
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/kometa
      - /home/%i/tmp/kometa
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/kometa
      - /home/%i/.krate/applications
      - /opt/%i/kometa/.venv
    read_only:
      - /opt/%i/kometa
version:
  probes:
    - type: file
      path: "{install_dir}/kometa.py"
    - type: pip
      venv: "{install_dir}/.venv"
      package: kometa
