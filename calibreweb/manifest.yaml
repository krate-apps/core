id: calibreweb
multi_user: true
runtime:
  kind: systemd
  service_template: calibreweb@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates python3 build-essential imagemagick
install:
  layout:
    backup_dir: /home/%i/.krate/backups/calibreweb
    data_dir: /home/%i/.config/calibreweb
    install_dir: /opt/%i/calibreweb
    temp_dir: /home/%i/tmp/calibreweb
  executable:
    - /opt/%i/calibreweb/.venv/bin/cps
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/calibreweb
  environment:
    inline:
      TMPDIR: /home/%i/tmp/calibreweb
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CALIBRE_DBPATH: /home/%i/.config/calibreweb
    file:
      path: /home/%i/.krate/applications/calibreweb.env
      mode: "0600"
      variables:
        CALIBRE_PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/calibreweb /home/%i/.config/calibreweb /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/calibreweb/.venv/bin/cps
      - -i
      - "127.0.0.1"
      - -p
      - /home/%i/.config/calibreweb/app.db
files:
  service: /etc/systemd/system/calibreweb@.service
  config:
    - /home/%i/.config/calibreweb/app.db
    - /home/%i/.krate/applications/calibreweb.env
  proxy:
    - /etc/caddy/softwares/%i.calibreweb.caddy
  binary:
    - /opt/%i/calibreweb/.venv/bin/cps
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/calibreweb
      - /home/%i/tmp/calibreweb
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/calibreweb
      - /home/%i/.krate/applications
      - /opt/%i/calibreweb/.venv
    read_only:
      - /opt/%i/calibreweb
version:
  probes:
    - type: pip
      venv: "{install_dir}/.venv"
      package: calibreweb
    - type: executable
      cmd: "{install_dir}/.venv/bin/cps"
      args: --version
      requires: active
