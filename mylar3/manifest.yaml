id: mylar3
multi_user: true
runtime:
  kind: systemd
  service_template: mylar3@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates python3 build-essential
install:
  release:
    branches:
      main: master
      beta: python3-dev
  layout:
    backup_dir: /home/%i/.krate/backups/mylar3
    data_dir: /home/%i/.config/mylar3
    install_dir: /opt/%i/mylar3
    temp_dir: /home/%i/tmp/mylar3
  executable:
    - /opt/%i/mylar3/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/mylar3
  environment:
    inline:
      TMPDIR: /home/%i/tmp/mylar3
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/mylar3.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/mylar3 /home/%i/.config/mylar3 /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/mylar3/.venv/bin/python
      - /opt/%i/mylar3/Mylar.py
      - --nolaunch
      - --datadir
      - /home/%i/.config/mylar3
      - --config
      - /home/%i/.config/mylar3/config.ini
      - --port
      - ${PORT}
files:
  service: /etc/systemd/system/mylar3@.service
  config:
    - /home/%i/.config/mylar3/config.ini
    - /home/%i/.krate/applications/mylar3.env
  database:
    - /home/%i/.config/mylar3/mylar.db
  proxy:
    - /etc/caddy/softwares/%i.mylar3.caddy
  binary:
    - /opt/%i/mylar3/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/mylar3
      - /home/%i/tmp/mylar3
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/mylar3
      - /home/%i/.krate/applications
      - /opt/%i/mylar3/.venv
    read_only:
      - /opt/%i/mylar3
version:
  probes:
    - type: file
      path: "{install_dir}/Mylar.py"
    - type: pip
      venv: "{install_dir}/.venv"
      package: cherrypy
