id: flaresolverr
name: FlareSolverr
description: "Proxy local pour défis Cloudflare (usage typique avec Jackett et
  les apps *arr). KRATE installe le binaire Linux officiel (archive GitHub),
  systemd, Chromium et Xvfb via APT — sans Docker."
links:
  homepage: https://github.com/FlareSolverr/FlareSolverr
  documentation: https://github.com/FlareSolverr/FlareSolverr/wiki
  source: https://github.com/FlareSolverr/FlareSolverr
  krate_docs: https://krate.github.io/docs/software/community/flaresolverr
tier: free
category: indexers
install_mode: local
autocomplete_options:
  - -b
ui_options:
  branches:
    - main
    - beta
  subdomain: false
