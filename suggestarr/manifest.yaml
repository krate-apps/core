id: suggestarr
multi_user: true
runtime:
  kind: systemd
  service_template: suggestarr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates
install:
  release:
    branches:
      beta: nightly
  layout:
    backup_dir: /home/%i/.krate/backups/suggestarr
    data_dir: /home/%i/.config/suggestarr
    install_dir: /opt/%i/suggestarr
    temp_dir: /home/%i/tmp/suggestarr
  executable:
    - /opt/%i/suggestarr/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/suggestarr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/suggestarr
      PYTHONUNBUFFERED: "1"
    file:
      path: /home/%i/.krate/applications/suggestarr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/suggestarr
    start:
      - /opt/%i/suggestarr/.venv/bin/python
      - -m
      - uvicorn
      - api_service.app:asgi_app
      - --host
      - "127.0.0.1"
      - --port
      - ${SUGGESTARR_PORT}
files:
  service: /etc/systemd/system/suggestarr@.service
  config:
    - /home/%i/.krate/applications/suggestarr.env
  proxy:
    - /etc/caddy/softwares/%i.suggestarr.caddy
  binary:
    - /opt/%i/suggestarr/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/suggestarr
      - /home/%i/tmp/suggestarr
      - /home/%i/.krate/backups/suggestarr
      - /home/%i/.krate/applications
      - /opt/%i/suggestarr/.venv
      - /opt/%i/suggestarr/static
    read_only:
      - /opt/%i/suggestarr
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/health"
      field: version
      requires: active
    - type: pip
      venv: "{install_dir}/.venv"
      package: suggestarr
