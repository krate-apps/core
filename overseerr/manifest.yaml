id: overseerr
multi_user: true
runtime:
  kind: systemd
  service_template: overseerr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates build-essential python3
install:
  release:
    branches:
      main: develop
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/overseerr
    data_dir: /home/%i/.config/overseerr
    install_dir: /opt/%i/overseerr
    temp_dir: /home/%i/tmp/overseerr
  executable:
    - /usr/local/bin/pnpm
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/overseerr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/overseerr
      NODE_ENV: production
      CYPRESS_INSTALL_BINARY: "0"
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/overseerr.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        HOST: "127.0.0.1"
        CONFIG_DIRECTORY: /home/%i/.config/overseerr/config
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/overseerr /home/%i/.local/share/pnpm /home/%i/.config/overseerr/config/db /home/%i/.config/overseerr/config/logs
    start:
      - /usr/local/bin/pnpm
      - exec
      - node
      - dist/index.js
files:
  service: /etc/systemd/system/overseerr@.service
  config:
    - /home/%i/.krate/applications/overseerr.env
  database:
    - /home/%i/.config/overseerr/config/db/db.sqlite3
  proxy:
    - /etc/caddy/softwares/%i.overseerr.caddy
  binary:
    - /usr/local/bin/pnpm
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/overseerr
      - /home/%i/tmp/overseerr
      - /home/%i/.krate/backups/overseerr
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/overseerr
    read_only: []
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v1/status"
      field: version
      requires: active
