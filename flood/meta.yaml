id: flood
name: Flood
description: Modern web UI for rTorrent (jesec/flood standalone binary, SCGI socket).
links:
  homepage: https://flood.js.org/
  documentation: https://github.com/jesec/flood/wiki
  source: https://github.com/jesec/flood
  krate_docs: https://runkrate.com/docs/software/community/flood
tier: pro
category: download
install_mode: local
password_constraints:
  min_length: 8
  max_length: 128
  require_upper: false
  require_digit: false
autocomplete_options:
  - -b
ui_options:
  branches:
    options:
      - main
      - beta
    label: app.branch
