id: byparr
multi_user: true
runtime:
  kind: systemd
  service_template: byparr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates
        libdbus-glib-1-2 libxt6 libnss3 libnspr4 libdbus-1-3
        libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgdk-pixbuf-2.0-0
        libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
        libxkbcommon0 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0
        libxshmfence1 libxslt1.1 fonts-liberation libxtst6
install:
  layout:
    install_dir: /opt/%i/byparr
    backup_dir: /home/%i/.krate/backups/byparr
    temp_dir: /home/%i/tmp/byparr
  executable:
    - /opt/%i/byparr/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: always
    RestartSec: "5"
    SyslogIdentifier: byparr@%i
    WorkingDirectory: /opt/%i/byparr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/byparr
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/byparr.env
      mode: "0600"
      variables:
        HOST: 127.0.0.1
        PORT: "{default_port}"
        LOG_LEVEL: INFO
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/byparr /home/%i/.cache/camoufox /home/%i/.cache/ms-playwright /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/byparr/.venv/bin/python
      - /opt/%i/byparr/main.py
files:
  service: /etc/systemd/system/byparr@.service
  config:
    - /home/%i/.krate/applications/byparr.env
  binary:
    - /opt/%i/byparr/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /opt/%i/byparr/.venv
      - /home/%i/tmp/byparr
      - /home/%i/.cache/camoufox
      - /home/%i/.cache/ms-playwright
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/byparr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/byparr
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}/"
      field: version
      requires: active
