id: btsync
multi_user: true
runtime:
  kind: systemd
  service_template: btsync@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/btsync
    data_dir: /home/%i/.config/btsync
    install_dir: /opt/%i/btsync
    temp_dir: /home/%i/tmp/btsync
  download:
    url: https://download-cdn.resilio.com/stable/linux/x64/resilio-sync_x64.tar.gz
  executable:
    - /opt/%i/btsync/rslsync
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/btsync
  environment:
    inline:
      TMPDIR: /home/%i/tmp/btsync
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/btsync.env
      mode: "0600"
      variables:
        BTSYNC_PORT: "{default_port}"
        BTSYNC_CONFIG: /home/%i/.config/btsync/config.json
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/btsync /home/%i/.config/btsync
    start:
      - /opt/%i/btsync/rslsync
      - --nodaemon
      - --config
      - /home/%i/.config/btsync/config.json
files:
  service: /etc/systemd/system/btsync@.service
  config:
    - /home/%i/.krate/applications/btsync.env
    - /home/%i/.config/btsync/config.json
  proxy:
    - /etc/caddy/softwares/%i.btsync.caddy
  binary:
    - /opt/%i/btsync/rslsync
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/btsync
      - /home/%i/tmp/btsync
      - /home/%i/.krate/backups/btsync
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/btsync
version:
  probes:
    - type: file
      path: "{install_dir}/rslsync"
