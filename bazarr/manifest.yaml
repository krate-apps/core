id: bazarr
multi_user: true
runtime:
  kind: systemd
  service_template: bazarr@.service
dependencies:
  apt:
    common:
      packages: git libxml2-dev libxmlsec1-dev liblzma-dev python3 python3-venv python3-dev python3-pip build-essential
install:
  layout:
    backup_dir: /home/%i/.krate/backups/bazarr
    data_dir: /home/%i/.config/bazarr
    install_dir: /opt/%i/bazarr
    temp_dir: /home/%i/.tmp/bazarr
  release:
    asset: bazarr.zip
    branches:
      main: master
      beta: development
  executable:
    - /opt/%i/bazarr/bazarr.py
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "5"
    UMask: "0002"
    WorkingDirectory: /opt/%i/bazarr
  environment:
    file:
      path: /home/%i/.krate/applications/bazarr.env
      mode: "0600"
      variables:
        TMPDIR: /home/%i/.tmp/bazarr
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/bazarr /home/%i/.config/bazarr/config /home/%i/.config/bazarr/db /home/%i/.config/bazarr/log
    start:
      - /opt/%i/bazarr/.venv/bin/python
      - /opt/%i/bazarr/bazarr.py
      - --no-update
      - --config
      - /home/%i/.config/bazarr
files:
  service: /etc/systemd/system/bazarr@.service
  config:
    - /home/%i/.krate/applications/bazarr.env
    - /home/%i/.config/bazarr/config/config.yaml
  database:
    - /home/%i/.config/bazarr/db/bazarr.db
  proxy:
    - /etc/caddy/softwares/%i.bazarr.caddy
  binary:
    - /opt/%i/bazarr/bazarr.py
autogen:
  - apikey
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/bazarr
      - /home/%i/.tmp/bazarr
      - /home/%i/.krate/backups/bazarr
    read_only:
      - /opt/%i/bazarr
version:
  probes:
    - type: file
      path: "{data_dir}/VERSION"
    - type: file
      path: "{install_dir}/VERSION"
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/system/status"
      field: data.bazarr_version
      auth: apikey
      auth_header: X-API-KEY
      requires: active
    - type: http_json
      url: "http://127.0.0.1:{default_port}/api/system/status"
      field: data.bazarr_version
      auth: apikey
      auth_header: X-API-KEY
      requires: active
  latest:
    probes:
      - type: http_json
        url: https://api.github.com/repos/morpheus65535/bazarr/releases/latest
        field: tag_name
