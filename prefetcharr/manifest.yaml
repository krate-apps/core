id: prefetcharr
multi_user: true
runtime:
  kind: systemd
  service_template: prefetcharr@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates build-essential pkg-config
install:
  release:
    branches:
      main: latest
      beta: latest
  layout:
    backup_dir: /home/%i/.krate/backups/prefetcharr
    data_dir: /home/%i/.config/prefetcharr
    install_dir: /opt/%i/prefetcharr
    temp_dir: /home/%i/tmp/prefetcharr
  executable:
    - /opt/%i/prefetcharr/bin/prefetcharr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/prefetcharr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/prefetcharr
      HOME: /home/%i
      CARGO_HOME: /home/%i/.cargo
      RUSTUP_HOME: /home/%i/.rustup
      PATH: /home/%i/.cargo/bin:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/prefetcharr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/prefetcharr /home/%i/.config/prefetcharr /home/%i/.cargo /home/%i/.rustup
    start:
      - /opt/%i/prefetcharr/bin/prefetcharr
      - --config
      - /home/%i/.config/prefetcharr/config.toml
files:
  service: /etc/systemd/system/prefetcharr@.service
  config:
    - /home/%i/.config/prefetcharr/config.toml
    - /home/%i/.krate/applications/prefetcharr.env
  binary:
    - /opt/%i/prefetcharr/bin/prefetcharr
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/prefetcharr
      - /home/%i/tmp/prefetcharr
      - /home/%i/.cargo
      - /home/%i/.rustup
      - /home/%i/.krate/backups/prefetcharr
      - /home/%i/.krate/applications
      - /opt/%i/prefetcharr
    read_only: []
version:
  probes:
    - type: executable
      cmd: "{install_dir}/bin/prefetcharr"
      args: --help
      requires: inactive
