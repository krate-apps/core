id: labelarr
multi_user: true
runtime:
  kind: systemd
  service_template: labelarr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/labelarr
    data_dir: /home/%i/.config/labelarr
    install_dir: /opt/%i/labelarr
    temp_dir: /home/%i/tmp/labelarr
  release:
    asset: labelarr-linux-amd64
  executable:
    - /opt/%i/labelarr/labelarr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/labelarr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/labelarr
    file:
      path: /home/%i/.krate/applications/labelarr.env
      mode: "0600"
      variables:
        DATA_DIR: /home/%i/.config/labelarr
        PLEX_SERVER: 127.0.0.1
        PLEX_PORT: "32400"
        MOVIE_PROCESS_ALL: "true"
        TV_PROCESS_ALL: "true"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/labelarr /home/%i/.config/labelarr
    start:
      - /opt/%i/labelarr/labelarr
files:
  service: /etc/systemd/system/labelarr@.service
  config:
    - /home/%i/.krate/applications/labelarr.env
  binary:
    - /opt/%i/labelarr/labelarr
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/labelarr
      - /home/%i/tmp/labelarr
      - /home/%i/.krate/backups/labelarr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/labelarr
version:
  probes:
    - type: executable
      cmd: "{install_dir}/labelarr"
      args: --version
      requires: active
