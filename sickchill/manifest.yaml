id: sickchill
multi_user: true
runtime:
  kind: systemd
  service_template: sickchill@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates python3 build-essential mediainfo unrar
install:
  release:
    branches:
      main: master
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/sickchill
    data_dir: /home/%i/.config/sickchill
    install_dir: /opt/%i/sickchill
    temp_dir: /home/%i/tmp/sickchill
  executable:
    - /opt/%i/sickchill/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/sickchill
  environment:
    inline:
      TMPDIR: /home/%i/tmp/sickchill
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    file:
      path: /home/%i/.krate/applications/sickchill.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/sickchill /home/%i/.config/sickchill /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/sickchill/.venv/bin/python
      - /opt/%i/sickchill/SickChill.py
      - --nolaunch
      - --datadir
      - /home/%i/.config/sickchill
      - --config
      - /home/%i/.config/sickchill/config.ini
      - --port
      - ${PORT}
files:
  service: /etc/systemd/system/sickchill@.service
  config:
    - /home/%i/.config/sickchill/config.ini
    - /home/%i/.krate/applications/sickchill.env
  database:
    - /home/%i/.config/sickchill/sickchill.db
  proxy:
    - /etc/caddy/softwares/%i.sickchill.caddy
  binary:
    - /opt/%i/sickchill/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/sickchill
      - /home/%i/tmp/sickchill
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/sickchill
      - /home/%i/.krate/applications
      - /opt/%i/sickchill/.venv
    read_only:
      - /opt/%i/sickchill
version:
  probes:
    - type: file
      path: "{install_dir}/SickChill.py"
    - type: file
      path: "{install_dir}/.venv/bin/python"
