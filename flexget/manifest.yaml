id: flexget
multi_user: true
runtime:
  kind: systemd
  service_template: flexget@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates python3 build-essential
install:
  layout:
    backup_dir: /home/%i/.krate/backups/flexget
    data_dir: /home/%i/.config/flexget
    install_dir: /opt/%i/flexget
    temp_dir: /home/%i/tmp/flexget
  executable:
    - /opt/%i/flexget/.venv/bin/flexget
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "15"
    WorkingDirectory: /home/%i/.config/flexget
  environment:
    inline:
      TMPDIR: /home/%i/tmp/flexget
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PATH: /opt/%i/flexget/.venv/bin:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/flexget.env
      mode: "0600"
      variables:
        FLEXGET_PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/flexget /home/%i/.config/flexget /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/flexget/.venv/bin/flexget
      - --logfile
      - /home/%i/.config/flexget/flexget.log
      - -c
      - /home/%i/.config/flexget/config.yml
      - daemon
      - start
files:
  service: /etc/systemd/system/flexget@.service
  config:
    - /home/%i/.config/flexget/config.yml
    - /home/%i/.krate/applications/flexget.env
  proxy:
    - /etc/caddy/softwares/%i.flexget.caddy
  binary:
    - /opt/%i/flexget/.venv/bin/flexget
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/flexget
      - /home/%i/tmp/flexget
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/flexget
      - /home/%i/.krate/applications
      - /opt/%i/flexget/.venv
    read_only:
      - /opt/%i/flexget
version:
  probes:
    - type: pip
      venv: "{install_dir}/.venv"
      package: flexget
    - type: executable
      cmd: "{install_dir}/.venv/bin/flexget"
      args: --version
      requires: active
