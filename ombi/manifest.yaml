id: ombi
multi_user: true
runtime:
  kind: systemd
  service_template: ombi@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/ombi
    data_dir: /home/%i/.config/ombi
    install_dir: /opt/%i/ombi
    temp_dir: /home/%i/.tmp/ombi
  release:
    asset: linux-x64.tar.gz
    branches:
      main: release
      beta: prerelease
  executable:
    - /opt/%i/ombi/Ombi
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/ombi
  environment:
    inline:
      TMPDIR: /home/%i/.tmp/ombi
    file:
      path: /home/%i/.krate/applications/ombi.env
      mode: "0600"
      variables:
        OMBI_PORT: "{default_port}"
        OMBI_STORAGE: /home/%i/.config/ombi
        OMBI_BASEURL: "{url_base}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/ombi /home/%i/.config/ombi
    start:
      - /opt/%i/ombi/Ombi
      - --host
      - http://127.0.0.1:${OMBI_PORT}
      - --storage
      - ${OMBI_STORAGE}
      - --baseurl
      - ${OMBI_BASEURL}
files:
  service: /etc/systemd/system/ombi@.service
  config:
    - /home/%i/.krate/applications/ombi.env
  proxy:
    - /etc/caddy/softwares/%i.ombi.caddy
  binary:
    - /opt/%i/ombi/Ombi
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/ombi
      - /home/%i/.tmp/ombi
      - /home/%i/.krate/backups/ombi
      - /home/%i/.krate/applications
      - /opt/%i/ombi/ClientApp/dist/browser/index.html
    read_only:
      - /opt/%i/ombi
version:
  probes:
    - type: file
      path: "{data_dir}/VERSION"
