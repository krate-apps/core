id: reiverr
multi_user: true
runtime:
  kind: systemd
  service_template: reiverr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates build-essential python3
install:
  release:
    branches:
      main: master
      beta: dev
  layout:
    backup_dir: /home/%i/.krate/backups/reiverr
    data_dir: /home/%i/.config/reiverr
    install_dir: /opt/%i/reiverr
    temp_dir: /home/%i/tmp/reiverr
  executable:
    - /usr/bin/node
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/reiverr/backend
  environment:
    inline:
      TMPDIR: /home/%i/tmp/reiverr
      NODE_ENV: production
      PATH: /usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/reiverr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/reiverr /home/%i/.config/reiverr/config /home/%i/.config/reiverr/plugins
    start:
      - /usr/bin/npm
      - run
      - start:prod
      - --prefix
      - /opt/%i/reiverr/backend
files:
  service: /etc/systemd/system/reiverr@.service
  config:
    - /home/%i/.krate/applications/reiverr.env
    - /home/%i/.config/reiverr/config/reiverr.sqlite
  proxy:
    - /etc/caddy/softwares/%i.reiverr.caddy
  binary:
    - /usr/bin/node
autogen:
  - default_port
  - apikey
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/reiverr
      - /home/%i/tmp/reiverr
      - /home/%i/.krate/backups/reiverr
      - /home/%i/.krate/applications
      - /opt/%i/reiverr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/package.json"
      field: version
