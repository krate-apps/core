id: recyclarr
multi_user: true
runtime:
  kind: systemd
  service_template: recyclarr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/recyclarr
    data_dir: /home/%i/.config/recyclarr
    install_dir: /opt/%i/recyclarr
    temp_dir: /home/%i/tmp/recyclarr
  release:
    asset: recyclarr-linux-x64.tar.xz
  executable:
    - /opt/%i/recyclarr/recyclarr
systemd:
  unit:
    TimeoutStopSec: 120
    Type: oneshot
    RemainAfterExit: "false"
    WorkingDirectory: /home/%i/.config/recyclarr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/recyclarr
    file:
      path: /home/%i/.krate/applications/recyclarr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/recyclarr /home/%i/.config/recyclarr
    start:
      - /opt/%i/recyclarr/recyclarr
      - sync
      - --app-data
      - /home/%i/.config/recyclarr
files:
  service: /etc/systemd/system/recyclarr@.service
  config:
    - /home/%i/.config/recyclarr/recyclarr.yml
    - /home/%i/.krate/applications/recyclarr.env
  binary:
    - /opt/%i/recyclarr/recyclarr
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/recyclarr
      - /home/%i/tmp/recyclarr
      - /home/%i/.krate/backups/recyclarr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/recyclarr
version:
  probes:
    - type: executable
      cmd: "{install_dir}/recyclarr"
      args: --version
      requires: inactive
