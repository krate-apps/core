id: rtorrent
name: rTorrent
description: "rTorrent vendor binary and rtorrent@<user> service. Config ~/.config/rtorrent/.rtorrent.rc (0.16.23 dialect; migrate via update or bin/rtorrent-rc-convert.sh). tmux session rtorrent-<user>, SCGI /run/krate/user/<user>.rtorrent.sock. autogen port_range. Default slot: newest (0.16.23). Selectable via -B: 0.16.23, 0.16.11 (archived), 0.15.7."
links:
  homepage: http://rakshasa.github.io/rtorrent/
  documentation: http://rakshasa.github.io/rtorrent/
  source: https://github.com/rakshasa/rtorrent
  krate_docs: https://runkrate.com/docs/software/official/rtorrent
tier: pro
category: download
install_mode: local
autocomplete_options:
  - -B
ui_options:
  versions:
    options:
      - "0.16.23"
      - "0.16.11"
      - "0.15.7"
    label: app.versions
