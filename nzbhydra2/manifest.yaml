id: nzbhydra2
multi_user: true
runtime:
  kind: systemd
  service_template: nzbhydra2@.service
dependencies:
  apt:
    common:
      packages: python3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/nzbhydra2
    data_dir: /home/%i/.config/nzbhydra2
    install_dir: /opt/%i/nzbhydra2
    temp_dir: /home/%i/tmp/nzbhydra2
  release:
    asset: amd64-linux.zip
  executable:
    - /opt/%i/nzbhydra2/nzbhydra2wrapperPy3.py
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/nzbhydra2
  environment:
    inline:
      TMPDIR: /home/%i/tmp/nzbhydra2
    file:
      path: /home/%i/.krate/applications/nzbhydra2.env
      mode: "0600"
      variables:
        NZBHYDRA2_PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/nzbhydra2 /home/%i/.config/nzbhydra2
    start:
      - /usr/bin/python3
      - /opt/%i/nzbhydra2/nzbhydra2wrapperPy3.py
      - --nobrowser
      - --datafolder
      - /home/%i/.config/nzbhydra2
      - --host
      - "127.0.0.1"
      - --port
      - ${NZBHYDRA2_PORT}
files:
  service: /etc/systemd/system/nzbhydra2@.service
  config:
    - /home/%i/.krate/applications/nzbhydra2.env
    - /home/%i/.config/nzbhydra2/nzbhydra.yml
  proxy:
    - /etc/caddy/softwares/%i.nzbhydra2.caddy
  binary:
    - /opt/%i/nzbhydra2/nzbhydra2wrapperPy3.py
    - /opt/%i/nzbhydra2/core
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/nzbhydra2
      - /home/%i/tmp/nzbhydra2
      - /home/%i/.krate/backups/nzbhydra2
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/nzbhydra2
version:
  probes:
    - type: file
      path: "{install_dir}/nzbhydra2wrapperPy3.py"
