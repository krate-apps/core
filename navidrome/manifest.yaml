id: navidrome
multi_user: true
runtime:
  kind: systemd
  service_template: navidrome@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates ffmpeg
install:
  layout:
    backup_dir: /home/%i/.krate/backups/navidrome
    data_dir: /home/%i/.config/navidrome
    install_dir: /opt/%i/navidrome
    temp_dir: /home/%i/tmp/navidrome
  release:
    # Matches navidrome_*_linux_amd64.tar.gz
    asset: linux_amd64.tar.gz
  executable:
    - /opt/%i/navidrome/navidrome
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/navidrome
  environment:
    inline:
      TMPDIR: /home/%i/tmp/navidrome
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/navidrome.env
      mode: "0600"
      variables:
        ND_ADDRESS: 127.0.0.1
        ND_PORT: "{default_port}"
        ND_MUSICFOLDER: /home/%i/media/music
        ND_DATAFOLDER: /home/%i/.config/navidrome
        ND_BASEURL: "{url_base}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/navidrome /home/%i/.config/navidrome /home/%i/media/music
    start:
      - /opt/%i/navidrome/navidrome
files:
  service: /etc/systemd/system/navidrome@.service
  config:
    - /home/%i/.krate/applications/navidrome.env
  proxy:
    - /etc/caddy/softwares/%i.navidrome.caddy
  binary:
    - /opt/%i/navidrome/navidrome
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/navidrome
      - /home/%i/tmp/navidrome
      - /home/%i/media/music
      - /home/%i/.krate/backups/navidrome
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/navidrome
version:
  probes:
    - type: executable
      cmd: "{install_dir}/navidrome"
      args: --version
      requires: active
