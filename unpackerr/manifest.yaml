id: unpackerr
multi_user: true
runtime:
  kind: systemd
  service_template: unpackerr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/unpackerr
    data_dir: /home/%i/.config/unpackerr
    install_dir: /opt/%i/unpackerr
    temp_dir: /home/%i/tmp/unpackerr
  release:
    asset: amd64.linux.gz
  executable:
    - /opt/%i/unpackerr/unpackerr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    UMask: "0002"
    WorkingDirectory: /home/%i/tmp/unpackerr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/unpackerr
    file:
      path: /home/%i/.krate/applications/unpackerr.env
      mode: "0600"
      variables:
        UN_INTERVAL: "2m"
        UN_START_DELAY: "1m"
        UN_LOG_FILE: /home/%i/.config/unpackerr/unpackerr.log
        UN_LOG_FILE_MB: "10"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/unpackerr
    start:
      - /opt/%i/unpackerr/unpackerr
files:
  service: /etc/systemd/system/unpackerr@.service
  config:
    - /home/%i/.krate/applications/unpackerr.env
  binary:
    - /opt/%i/unpackerr/unpackerr
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/unpackerr
      - /home/%i/tmp/unpackerr
      - /home/%i/.krate/backups/unpackerr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/unpackerr
version:
  probes:
    - type: executable
      cmd: "{install_dir}/unpackerr"
      args: version
      requires: active
