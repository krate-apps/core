id: crossseed
multi_user: true
runtime:
  kind: systemd
  service_template: crossseed@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/crossseed
    data_dir: /home/%i/.config/crossseed
    install_dir: /opt/%i/crossseed
    temp_dir: /home/%i/tmp/crossseed
  executable:
    - /opt/%i/crossseed/node_modules/.bin/cross-seed
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/crossseed
  environment:
    inline:
      TMPDIR: /home/%i/tmp/crossseed
      HOME: /home/%i
      NODE_ENV: production
      CONFIG_DIR: /home/%i/.config/crossseed
      PATH: /opt/%i/crossseed/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/crossseed.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        CONFIG_DIR: /home/%i/.config/crossseed
        CROSSSEED_BASE_PATH: ""
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/crossseed /home/%i/.config/crossseed
    start:
      - /opt/%i/crossseed/node_modules/.bin/cross-seed
      - daemon
      - --host
      - "127.0.0.1"
      - -p
      - ${PORT}
      - --base-path
      - ${CROSSSEED_BASE_PATH}
files:
  service: /etc/systemd/system/crossseed@.service
  config:
    - /home/%i/.config/crossseed/config.js
    - /home/%i/.krate/applications/crossseed.env
  proxy:
    - /etc/caddy/softwares/%i.crossseed.caddy
  binary:
    - /opt/%i/crossseed/node_modules/.bin/cross-seed
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/crossseed
      - /home/%i/tmp/crossseed
      - /home/%i/.krate/backups/crossseed
      - /home/%i/.krate/applications
      - /opt/%i/crossseed
    read_only: []
version:
  probes:
    - type: executable
      cmd: "{install_dir}/node_modules/.bin/cross-seed"
      args: --version
      requires: active
