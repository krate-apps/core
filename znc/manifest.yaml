id: znc
multi_user: true
runtime:
  kind: systemd
  service_template: znc@.service
dependencies:
  apt:
    common:
      packages: znc ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/znc
    data_dir: /home/%i/.config/znc
    install_dir: /opt/%i/znc
    temp_dir: /home/%i/tmp/znc
  executable:
    - /usr/bin/znc
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/znc
  environment:
    inline:
      TMPDIR: /home/%i/tmp/znc
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/znc.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/znc /home/%i/.config/znc
    start:
      - /usr/bin/znc
      - --foreground
      - --datadir=/home/%i/.config/znc
files:
  service: /etc/systemd/system/znc@.service
  config:
    - /home/%i/.config/znc/configs/znc.conf
    - /home/%i/.krate/applications/znc.env
  proxy:
    - /etc/caddy/softwares/%i.znc.caddy
  binary:
    - /usr/bin/znc
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/znc
      - /home/%i/tmp/znc
      - /home/%i/.krate/backups/znc
      - /home/%i/.krate/applications
      - /opt/%i/znc
    read_only: []
version:
  probes:
    - type: executable
      cmd: /usr/bin/znc
      args: --version
      requires: active
