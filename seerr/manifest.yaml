id: seerr
multi_user: true
runtime:
  kind: systemd
  service_template: seerr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates build-essential python3
install:
  release:
  layout:
    backup_dir: /home/%i/.krate/backups/seerr
    data_dir: /home/%i/.config/seerr
    install_dir: /opt/%i/seerr
    temp_dir: /home/%i/tmp/seerr
  executable:
    - /usr/local/bin/pnpm
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/seerr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/seerr
      NODE_ENV: production
      CYPRESS_INSTALL_BINARY: "0"
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/seerr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/seerr /home/%i/.local/share/pnpm /home/%i/.config/seerr/config/db /home/%i/.config/seerr/config/logs
    start:
      - /usr/local/bin/pnpm
      - exec
      - node
      - dist/index.js
files:
  service: /etc/systemd/system/seerr@.service
  config:
    - /home/%i/.krate/applications/seerr.env
  database:
    - /home/%i/.config/seerr/config/db/db.sqlite3
  proxy:
    - /etc/caddy/softwares/%i.seerr.caddy
  binary:
    - /usr/local/bin/pnpm
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/seerr
      - /home/%i/tmp/seerr
      - /home/%i/.krate/backups/seerr
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/seerr
    read_only: []
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v1/status"
      field: version
      requires: active
