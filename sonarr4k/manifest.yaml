id: sonarr4k
multi_user: true
runtime:
  kind: systemd
  service_template: sonarr4k@.service
dependencies:
  apt:
    common:
      packages: ca-certificates-mono mono-devel mediainfo sqlite3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/sonarr4k
    data_dir: /home/%i/.config/sonarr4k
    install_dir: /opt/%i/sonarr4k
    temp_dir: /home/%i/tmp/sonarr4k
  release:
    asset: linux-x64.tar.gz
    update_branch:
      stable: master
      prerelease: develop
  executable:
    - /opt/%i/sonarr4k/Sonarr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/sonarr4k
    file:
      path: /home/%i/.krate/applications/sonarr4k.env
      mode: "0600"
      variables:
        SONARR__SERVER__BINDADDRESS: 127.0.0.1
        SONARR__SERVER__PORT: "{default_port}"
        SONARR__SERVER__URLBASE: "{url_base}"
        SONARR__SERVER__ENABLESSL: "False"
        SONARR__SERVER__SSLPORT: "{ssl_port}"
        SONARR__AUTH__APIKEY: "{apikey}"
        SONARR__UPDATE__BRANCH: "master"
        SONARR__APP__LAUNCHBROWSER: "False"
        SONARR__APP__INSTANCENAME: "{instance_name}"
        SONARR__LOG__ANALYTICSENABLED: "False"
        SONARR__APP__THEME: dark
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/sonarr4k
    start:
      - /opt/%i/sonarr4k/Sonarr
      - -nobrowser
      - -data=/home/%i/.config/sonarr4k
files:
  service: /etc/systemd/system/sonarr4k@.service
  config:
    - /home/%i/.krate/applications/sonarr4k.env
  database:
    - /home/%i/.config/sonarr4k/sonarr.db
  proxy:
    - /etc/caddy/softwares/%i.sonarr4k.caddy
  binary:
    - /opt/%i/sonarr4k/Sonarr
autogen:
  - apikey
  - default_port
  - ssl_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/sonarr4k
      - /home/%i/tmp/sonarr4k
      - /home/%i/.krate/backups/sonarr4k
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/sonarr4k
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v3/system/status"
      field: version
      auth: apikey
      requires: active
  latest:
    probes:
      - type: http_json
        url: "http://127.0.0.1:{default_port}{root_url}/api/v3/update"
        field: "0.version"
        auth: apikey
        requires: active
