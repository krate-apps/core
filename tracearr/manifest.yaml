id: tracearr
multi_user: true
runtime:
  kind: systemd
  service_template: tracearr@.service
dependencies:
  apt:
    common:
      packages: >-
        git curl ca-certificates build-essential python3
        redis-server postgresql postgresql-contrib postgresql-client
install:
  release:
    branches:
      main: main
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/tracearr
    data_dir: /home/%i/.config/tracearr
    install_dir: /opt/%i/tracearr
    temp_dir: /home/%i/tmp/tracearr
  executable:
    - /usr/local/bin/pnpm
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/tracearr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/tracearr
      NODE_ENV: production
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
      LOG_LEVEL: info
    file:
      path: /home/%i/.krate/applications/tracearr.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        HOST: "127.0.0.1"
        NODE_ENV: production
        REDIS_URL: redis://127.0.0.1:6379
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/tracearr /home/%i/.local/share/pnpm /home/%i/.config/tracearr
    start:
      - /usr/local/bin/pnpm
      - exec
      - node
      - apps/server/dist/index.js
files:
  service: /etc/systemd/system/tracearr@.service
  config:
    - /home/%i/.krate/applications/tracearr.env
  proxy:
    - /etc/caddy/softwares/%i.tracearr.caddy
  binary:
    - /usr/local/bin/pnpm
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/tracearr
      - /home/%i/tmp/tracearr
      - /home/%i/.krate/backups/tracearr
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/tracearr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/package.json"
      field: version
    - type: http
      url: "http://127.0.0.1:{default_port}/health"
      requires: active
