id: jellyfin
multi_user: true
runtime:
  kind: systemd
  service_template: jellyfin@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates sqlite3
install:
  layout:
    install_dir: /opt/%i/jellyfin
    data_dir: /home/%i/.config/jellyfin
    backup_dir: /home/%i/.krate/backups/jellyfin
    temp_dir: /home/%i/tmp/jellyfin
  release:
    asset: amd64.tar.gz
    base: https://repo.jellyfin.org/files/server/linux/latest-{channel}/amd64/
    channel_guard:
      prerelease: stable
  ffmpeg:
    repo: jellyfin/jellyfin-ffmpeg
    asset: portable_linux64-gpl.tar.xz
    subdir: ffmpeg
  executable:
    - /opt/%i/jellyfin/jellyfin
systemd:
  unit:
    Restart: on-failure
    RestartSec: "5"
    TimeoutStartSec: "600"
    TimeoutStopSec: 20
    Type: simple
    LimitNOFILE: "65536"
    WorkingDirectory: /opt/%i/jellyfin
  environment:
    inline:
      TMPDIR: /home/%i/tmp/jellyfin
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/jellyfin /home/%i/.config/jellyfin/config
    start:
      - /opt/%i/jellyfin/jellyfin
      - --datadir
      - /home/%i/.config/jellyfin
      - --webdir
      - /opt/%i/jellyfin/jellyfin-web
      - --ffmpeg
      - /opt/%i/jellyfin/ffmpeg/ffmpeg
files:
  service: /etc/systemd/system/jellyfin@.service
  config:
    - /home/%i/.config/jellyfin/config/network.xml
  database:
    - /home/%i/.config/jellyfin/data/jellyfin.db
  proxy:
    - /etc/caddy/softwares/%i.jellyfin.caddy
  binary:
    - /opt/%i/jellyfin/jellyfin
autogen:
  - apikey
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/jellyfin
      - /home/%i/tmp/jellyfin
      - /home/%i/.krate/backups/jellyfin
    read_only:
      - /opt/%i/jellyfin
