id: unmanic
multi_user: true
runtime:
  kind: systemd
  service_template: unmanic@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates python3 build-essential ffmpeg
install:
  release:
    branches:
      main: master
      beta: master
  layout:
    backup_dir: /home/%i/.krate/backups/unmanic
    data_dir: /home/%i/.config/unmanic
    install_dir: /opt/%i/unmanic
    temp_dir: /home/%i/tmp/unmanic
  executable:
    - /opt/%i/unmanic/.venv/bin/unmanic
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/unmanic
  environment:
    inline:
      TMPDIR: /home/%i/tmp/unmanic
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      config_path: /home/%i/.config/unmanic/config
      plugins_path: /home/%i/.config/unmanic/plugins
      userdata_path: /home/%i/.config/unmanic/userdata
      log_path: /home/%i/.config/unmanic/logs
      cache_path: /home/%i/tmp/unmanic/cache
    file:
      path: /home/%i/.krate/applications/unmanic.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/unmanic /home/%i/tmp/unmanic/cache /home/%i/.config/unmanic/config /home/%i/.config/unmanic/plugins /home/%i/.config/unmanic/userdata /home/%i/.config/unmanic/logs /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/unmanic/.venv/bin/unmanic
      - --port
      - ${PORT}
      - --address
      - "127.0.0.1"
files:
  service: /etc/systemd/system/unmanic@.service
  config:
    - /home/%i/.config/unmanic/config/settings.json
    - /home/%i/.krate/applications/unmanic.env
  database:
    - /home/%i/.config/unmanic/config/unmanic.db
  proxy:
    - /etc/caddy/softwares/%i.unmanic.caddy
  binary:
    - /opt/%i/unmanic/.venv/bin/unmanic
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/unmanic
      - /home/%i/tmp/unmanic
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/unmanic
      - /home/%i/.krate/applications
      - /opt/%i/unmanic/.venv
    read_only:
      - /opt/%i/unmanic
version:
  probes:
    - type: pip
      venv: "{install_dir}/.venv"
      package: unmanic
    - type: executable
      cmd: "{install_dir}/.venv/bin/unmanic"
      args: --version
      requires: active
