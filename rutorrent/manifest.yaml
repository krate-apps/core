id: rutorrent
multi_user: true
require: rtorrent
sync_repos:
  - apps-extensions
# apps-extensions: rutorrent/ext/* → plugins/ ; rutorrent/themes/* → plugins/theme/themes/
# Path-based UI: /{user}/rutorrent (url_base from lifecycle). Requires rtorrent@{user}.
#
# Layout:
#   /srv/rutorrent/app                    — shared app code (Novik clone; plugins via zen pull + HarmonyUI)
#   /var/lib/krate/rutorrent/%i           — conf/, settings/ (+ tmp/, torrents/ symlinks)
#   forbidUserSettings via config.local.php — no /users/%i/ suffix (Novik)
#   Downloads (topDirectory)              — /home/%i/download-clients/rtorrent/
dependencies:
  apt:
    common:
      packages: php8.4-curl php8.4-mbstring php8.4-xml php8.4-zip geoip-database p7zip-full unrar ffmpeg mediainfo sox
install:
  layout:
    install_dir: /srv/rutorrent/app
    data_dir: /var/lib/krate/rutorrent/%i
    backup_dir: /home/%i/.krate/backups/rutorrent
proxy:
  mode: php_subpath
  document_root: /srv/rutorrent/app
systemd: {}
files:
  config:
    - /var/lib/krate/rutorrent/%i/conf/config.php
  proxy:
    - /etc/caddy/softwares/%i.rutorrent.caddy
autogen: []
security:
  network: true
  filesystem:
    read_write:
      - /srv/rutorrent/app
      - /var/lib/krate/rutorrent/%i
      - /home/%i/.krate/backups/rutorrent
      - /home/%i/download-clients/rtorrent
      - /home/%i/tmp/rtorrent
      - /run/krate/user
    read_only:
      - /etc/caddy/auth/local/users.json
      - /etc/caddy/auth/users.json
