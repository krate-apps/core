;; Per-user ruTorrent plugin permissions (KRATE).
;; ruTorrent reads this file instead of conf/plugins.ini, so [default] must
;; restate the core defaults. enabledByDefault = no starts a plugin off for
;; a user who never toggled it; it can still be enabled from Settings > Plugins.

[default]
enabled = user-defined
canChangeToolbar = yes
canChangeMenu = yes
canChangeOptions = yes
canChangeTabs = yes
canChangeColumns = yes
canChangeStatusBar = yes
canChangeCategory = yes
canBeShutdowned = yes

[autodl-irssi]
enabledByDefault = no

[filemanager]
enabledByDefault = no

[filemanager-media]
enabledByDefault = no

[filemanager-share]
enabledByDefault = no

[_cloudflare]
enabledByDefault = no

[screenshots]
enabledByDefault = no

[spectrogram]
enabledByDefault = no

[rss]
enabledByDefault = no

[rssurlrewrite]
enabledByDefault = no

[extsearch]
enabledByDefault = no

[history]
enabledByDefault = no

[scheduler]
enabledByDefault = no

[lookat]
enabledByDefault = no

[dump]
enabledByDefault = no

[discord]
enabledByDefault = no

[all-seeders]
enabledByDefault = no

[pausewebui]
enabledByDefault = no
