id: lidarr
multi_user: true
runtime:
  kind: systemd
  service_template: lidarr@.service
dependencies:
  apt:
    common:
      packages: mediainfo libchromaprint-tools
install:
  layout:
    backup_dir: /home/%i/.krate/backups/lidarr
    data_dir: /home/%i/.config/lidarr
    install_dir: /opt/%i/lidarr
    temp_dir: /home/%i/tmp/lidarr
  release:
    asset: linux-core-x64.tar.gz
    branches:
      main: master
      beta: develop
  executable:
    - /opt/%i/lidarr/Lidarr
    - /opt/%i/lidarr/fpcalc
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/lidarr
    file:
      path: /home/%i/.krate/applications/lidarr.env
      mode: "0600"
      variables:
        LIDARR__SERVER__BINDADDRESS: 127.0.0.1
        LIDARR__SERVER__PORT: "{default_port}"
        LIDARR__SERVER__URLBASE: "{url_base}"
        LIDARR__SERVER__ENABLESSL: "False"
        LIDARR__SERVER__SSLPORT: "{ssl_port}"
        LIDARR__AUTH__APIKEY: "{apikey}"
        LIDARR__UPDATE__BRANCH: "master"
        LIDARR__APP__LAUNCHBROWSER: "False"
        LIDARR__APP__INSTANCENAME: "{instance_name}"
        LIDARR__LOG__ANALYTICSENABLED: "False"
        LIDARR__APP__THEME: dark
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/lidarr
    start:
      - /opt/%i/lidarr/Lidarr
      - -nobrowser
      - -data=/home/%i/.config/lidarr
files:
  service: /etc/systemd/system/lidarr@.service
  config:
    - /home/%i/.krate/applications/lidarr.env
  database:
    - /home/%i/.config/lidarr/lidarr.db
  proxy:
    - /etc/caddy/softwares/%i.lidarr.caddy
  binary:
    - /opt/%i/lidarr/Lidarr
autogen:
  - apikey
  - default_port
  - ssl_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/lidarr
      - /home/%i/tmp/lidarr
      - /home/%i/.krate/backups/lidarr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/lidarr
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v1/system/status"
      field: version
      auth: apikey
      requires: active
  latest:
    probes:
      - type: http_json
        url: "http://127.0.0.1:{default_port}{root_url}/api/v1/update"
        field: "0.version"
        auth: apikey
        requires: active
