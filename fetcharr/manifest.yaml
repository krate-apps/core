id: fetcharr
multi_user: true
runtime:
  kind: systemd
  service_template: fetcharr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates build-essential python3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/fetcharr
    data_dir: /home/%i/.config/fetcharr
    install_dir: /opt/%i/fetcharr
    temp_dir: /home/%i/tmp/fetcharr
  executable:
    - /usr/bin/node
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/fetcharr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/fetcharr
      NODE_ENV: production
      PATH: /usr/local/bin:/usr/bin:/bin
    file:
      path: /home/%i/.krate/applications/fetcharr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/fetcharr /home/%i/.config/fetcharr/config
    start:
      - /usr/bin/node
      - --env-file-if-exists=/home/%i/.krate/applications/fetcharr.env
      - src/server.js
files:
  service: /etc/systemd/system/fetcharr@.service
  config:
    - /home/%i/.krate/applications/fetcharr.env
    - /home/%i/.config/fetcharr/config/state.db
  proxy:
    - /etc/caddy/softwares/%i.fetcharr.caddy
  binary:
    - /usr/bin/node
autogen:
  - default_port
  - apikey
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/fetcharr
      - /home/%i/tmp/fetcharr
      - /home/%i/.krate/backups/fetcharr
      - /home/%i/.krate/applications
      - /opt/%i/fetcharr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/package.json"
      field: version
