id: whisparr
multi_user: true
runtime:
  kind: systemd
  service_template: whisparr@.service
dependencies:
  apt:
    common:
      packages: ca-certificates-mono mono-devel mediainfo sqlite3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/whisparr
    data_dir: /home/%i/.config/whisparr
    install_dir: /opt/%i/whisparr
    temp_dir: /home/%i/tmp/whisparr
  release:
    asset: linux-x64.tar.gz
    branches:
      main: master
      beta: develop
  executable:
    - /opt/%i/whisparr/Whisparr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/whisparr
    file:
      path: /home/%i/.krate/applications/whisparr.env
      mode: "0600"
      variables:
        WHISPARR__SERVER__BINDADDRESS: 127.0.0.1
        WHISPARR__SERVER__PORT: "{default_port}"
        WHISPARR__SERVER__ENABLESSL: "False"
        WHISPARR__SERVER__SSLPORT: "{ssl_port}"
        WHISPARR__AUTH__APIKEY: "{apikey}"
        WHISPARR__UPDATE__BRANCH: "master"
        WHISPARR__APP__LAUNCHBROWSER: "False"
        WHISPARR__APP__INSTANCENAME: "{instance_name}"
        WHISPARR__LOG__ANALYTICSENABLED: "False"
        WHISPARR__APP__THEME: dark
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/whisparr
    start:
      - /opt/%i/whisparr/Whisparr
      - -nobrowser
      - -data=/home/%i/.config/whisparr
files:
  service: /etc/systemd/system/whisparr@.service
  config:
    - /home/%i/.krate/applications/whisparr.env
  database:
    - /home/%i/.config/whisparr/whisparr.db
  proxy:
    - /etc/caddy/softwares/%i.whisparr.caddy
  binary:
    - /opt/%i/whisparr/Whisparr
autogen:
  - apikey
  - default_port
  - ssl_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/whisparr
      - /home/%i/tmp/whisparr
      - /home/%i/.krate/backups/whisparr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/whisparr
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v3/system/status"
      field: version
      auth: apikey
      requires: active
  latest:
    probes:
      - type: http_json
        url: "http://127.0.0.1:{default_port}{root_url}/api/v3/update"
        field: "0.version"
        auth: apikey
        requires: active
