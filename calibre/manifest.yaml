id: calibre
multi_user: true
runtime:
  kind: systemd
  service_template: calibre@.service
dependencies:
  apt:
    common:
      packages: calibre ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/calibre
    data_dir: /home/%i/.config/calibre
    install_dir: /opt/%i/calibre
    temp_dir: /home/%i/tmp/calibre
  executable:
    - /usr/bin/calibre-server
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/calibre
  environment:
    inline:
      TMPDIR: /home/%i/tmp/calibre
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/calibre.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
        CALIBRE_LIBRARY: /home/%i/.config/calibre/library
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/calibre /home/%i/.config/calibre/library
    start:
      - /usr/bin/calibre-server
      - --port=${PORT}
      - --listen-on=127.0.0.1
      - --disable-fallback-to-detected-interface
      - ${CALIBRE_LIBRARY}
files:
  service: /etc/systemd/system/calibre@.service
  config:
    - /home/%i/.krate/applications/calibre.env
  database:
    - /home/%i/.config/calibre/library/metadata.db
  proxy:
    - /etc/caddy/softwares/%i.calibre.caddy
  binary:
    - /usr/bin/calibre-server
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/calibre
      - /home/%i/tmp/calibre
      - /home/%i/.krate/backups/calibre
      - /home/%i/.krate/applications
      - /opt/%i/calibre
    read_only: []
version:
  probes:
    - type: executable
      cmd: /usr/bin/calibre-server
      args: --version
      requires: active
