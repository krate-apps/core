id: maintainerr
multi_user: true
runtime:
  kind: systemd
  service_template: maintainerr@.service
dependencies:
  apt:
    common:
      packages: >-
        git curl ca-certificates build-essential python3 pkg-config
        libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev libpixman-1-dev librsvg2-dev
install:
  release:
    branches:
      main: main
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/maintainerr
    data_dir: /home/%i/.config/maintainerr
    install_dir: /opt/%i/maintainerr
    temp_dir: /home/%i/tmp/maintainerr
  executable:
    - /opt/%i/maintainerr/maintainerr-run
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/maintainerr/apps/server
  environment:
    inline:
      TMPDIR: /home/%i/tmp/maintainerr
      NODE_ENV: production
      PNPM_HOME: /home/%i/.local/share/pnpm
      PATH: /home/%i/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
      DATA_DIR: /home/%i/.config/maintainerr
    file:
      path: /home/%i/.krate/applications/maintainerr.env
      mode: "0600"
      variables:
        UI_PORT: "{default_port}"
        UI_HOSTNAME: "127.0.0.1"
        DATA_DIR: /home/%i/.config/maintainerr
        NODE_ENV: production
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/maintainerr /home/%i/.local/share/pnpm /home/%i/.config/maintainerr/logs
    start:
      - /opt/%i/maintainerr/maintainerr-run
files:
  service: /etc/systemd/system/maintainerr@.service
  config:
    - /home/%i/.krate/applications/maintainerr.env
  database:
    - /home/%i/.config/maintainerr/maintainerr.sqlite
  proxy:
    - /etc/caddy/softwares/%i.maintainerr.caddy
  binary:
    - /opt/%i/maintainerr/maintainerr-run
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/maintainerr
      - /home/%i/tmp/maintainerr
      - /home/%i/.krate/backups/maintainerr
      - /home/%i/.krate/applications
      - /home/%i/.local/share/pnpm
      - /home/%i/.cache
      - /opt/%i/maintainerr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/apps/server/package.json"
      field: version
    - type: http
      url: "http://127.0.0.1:{default_port}/api/status"
      requires: active
