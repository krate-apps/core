id: rclone
multi_user: true
runtime:
  kind: systemd
  service_template: rclone@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates unzip fuse3 mergerfs
install:
  layout:
    backup_dir: /home/%i/.krate/backups/rclone
    data_dir: /home/%i/.config/rclone
    install_dir: /opt/%i/rclone
    temp_dir: /home/%i/.tmp/rclone
  release:
    # Matches rclone-*-linux-amd64.zip
    asset: linux-amd64.zip
    branches:
      main: release
  executable:
    - /opt/%i/rclone/rclone
    - /opt/%i/rclone/rclone-verify
systemd:
  unit:
    TimeoutStopSec: 30
    Type: oneshot
    RemainAfterExit: "true"
    WorkingDirectory: /opt/%i/rclone
  environment:
    inline:
      TMPDIR: /home/%i/.tmp/rclone
      HOME: /home/%i
      RCLONE_CONFIG: /home/%i/.config/rclone/rclone.conf
    file:
      path: /home/%i/.krate/applications/rclone.env
      mode: "0600"
      variables:
        RCLONE_CONFIG: /home/%i/.config/rclone/rclone.conf
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/rclone /home/%i/.config/rclone /home/%i/mounts /home/%i/mounts/cache /home/%i/mounts/media /home/%i/mounts/remote /home/%i/mounts/remotes /home/%i/mounts/union /home/%i/mounts/views /home/%i/.krate/applications/rclone-cloud /home/%i/.krate/logs/rclone
    start:
      - /opt/%i/rclone/rclone-verify
files:
  service: /etc/systemd/system/rclone@.service
  config:
    - /home/%i/.config/rclone/rclone.conf
    - /home/%i/.krate/applications/rclone.env
  binary:
    - /opt/%i/rclone/rclone
    - /opt/%i/rclone/rclone-verify
autogen: []
security:
  network: false
  filesystem:
    read_write:
      - /home/%i/.config/rclone
      - /home/%i/.tmp/rclone
      - /home/%i/mounts
      - /home/%i/.krate/backups/rclone
      - /home/%i/.krate/applications
      - /home/%i/.krate/logs/rclone
    read_only:
      - /opt/%i/rclone
version:
  probes:
    - type: executable
      cmd: "{install_dir}/rclone"
      args: version
      requires: inactive
