id: rclone
name: rclone
description: "Cloud storage sync with web UI (rclone rcd + rc-web-gui on loopback)."
links:
  homepage: https://rclone.org/
  documentation: https://rclone.org/docs/
  source: https://github.com/rclone/rclone
  krate_docs: https://krate.github.io/docs/software/official/rclone
tier: free
category: network
install_mode: local
password_constraints:
  min_length: 8
  max_length: 128
  require_upper: false
  require_digit: false
autocomplete_options:
  - -b
ui_options:
  branches:
    - main
    - beta
