id: rclone
name: rclone
description: "Cloud storage with guided OAuth/SA, FUSE mounts, mergerfs media/views, crypt, and scheduled cache→remote move."
links:
  homepage: https://rclone.org/
  documentation: https://rclone.org/docs/
  source: https://github.com/rclone/rclone
  krate_docs: https://runkrate.com/docs/software/community/rclone
tier: free
category: cloud
install_mode: local
password_constraints:
  min_length: 8
  max_length: 128
  require_upper: false
  require_digit: false
autocomplete_options:
  - --rclone-preset
  - --rclone-mode
  - --rclone-provider
  - --rclone-remote
  - --rclone-team-drive
  - --rclone-drive-root
ui_options:
  subdomain:
    enabled: false
  rclone_preset:
    options:
      - media
      - browse
    label: app.rclone.preset
  rclone_mode:
    options:
      - import
      - wizard
    label: app.rclone.mode
  rclone_provider:
    options:
      - import
      - kdrive
      - drive
      - dropbox
      - s3
      - webdav
      - onedrive
      - crypt
    label: app.rclone.provider
  rclone_remote:
    enabled: true
    label: app.rclone.remote
  rclone_drive_root:
    options:
      - mydrive
      - shared
    label: app.rclone.drive_root
  rclone_team_drive:
    enabled: true
    optional: true
    label: app.rclone.team_drive
