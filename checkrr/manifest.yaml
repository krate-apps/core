id: checkrr
multi_user: true
runtime:
  kind: systemd
  service_template: checkrr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/checkrr
    data_dir: /home/%i/.config/checkrr
    install_dir: /opt/%i/checkrr
    temp_dir: /home/%i/tmp/checkrr
  release:
    asset: _linux_amd64.tar.gz
  executable:
    - /opt/%i/checkrr/checkrr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/checkrr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/checkrr
    file:
      path: /home/%i/.krate/applications/checkrr.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/checkrr /home/%i/.config/checkrr
    start:
      - /opt/%i/checkrr/checkrr
      - -c
      - /home/%i/.config/checkrr/checkrr.yaml
files:
  service: /etc/systemd/system/checkrr@.service
  config:
    - /home/%i/.config/checkrr/checkrr.yaml
    - /home/%i/.krate/applications/checkrr.env
  proxy:
    - /etc/caddy/softwares/%i.checkrr.caddy
  binary:
    - /opt/%i/checkrr/checkrr
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/checkrr
      - /home/%i/tmp/checkrr
      - /home/%i/.krate/backups/checkrr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/checkrr
version:
  probes:
    - type: executable
      cmd: "{install_dir}/checkrr"
      args: --version
      requires: active
