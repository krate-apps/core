id: medusa
multi_user: true
runtime:
  kind: systemd
  service_template: medusa@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates python3 build-essential mediainfo unrar
install:
  release:
    branches:
      main: master
      beta: develop
  layout:
    backup_dir: /home/%i/.krate/backups/medusa
    data_dir: /home/%i/.config/medusa
    install_dir: /opt/%i/medusa
    temp_dir: /home/%i/tmp/medusa
  executable:
    - /opt/%i/medusa/.venv/bin/python
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/medusa
  environment:
    inline:
      TMPDIR: /home/%i/tmp/medusa
      HOME: /home/%i
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MEDUSA_WEB_PORT: "{default_port}"
    file:
      path: /home/%i/.krate/applications/medusa.env
      mode: "0600"
      variables:
        PORT: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/medusa /home/%i/.config/medusa /home/%i/.cache/uv /home/%i/.local/share/uv
    start:
      - /opt/%i/medusa/.venv/bin/python
      - /opt/%i/medusa/start.py
      - --nolaunch
      - --datadir
      - /home/%i/.config/medusa
      - --config
      - /home/%i/.config/medusa/config.ini
      - --port
      - ${PORT}
files:
  service: /etc/systemd/system/medusa@.service
  config:
    - /home/%i/.config/medusa/config.ini
    - /home/%i/.krate/applications/medusa.env
  database:
    - /home/%i/.config/medusa/main.db
  proxy:
    - /etc/caddy/softwares/%i.medusa.caddy
  binary:
    - /opt/%i/medusa/.venv/bin/python
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/medusa
      - /home/%i/tmp/medusa
      - /home/%i/.cache/uv
      - /home/%i/.local/share/uv
      - /home/%i/.krate/backups/medusa
      - /home/%i/.krate/applications
      - /opt/%i/medusa/.venv
    read_only:
      - /opt/%i/medusa
version:
  probes:
    - type: file
      path: "{install_dir}/start.py"
    - type: file
      path: "{install_dir}/.venv/bin/python"
