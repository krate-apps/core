id: autoscan
multi_user: true
runtime:
  kind: systemd
  service_template: autoscan@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/autoscan
    data_dir: /home/%i/.config/autoscan
    install_dir: /opt/%i/autoscan
    temp_dir: /home/%i/tmp/autoscan
  release:
    # Matches autoscan_v*_linux_amd64
    asset: linux_amd64
  executable:
    - /opt/%i/autoscan/autoscan
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /home/%i/.config/autoscan
  environment:
    inline:
      TMPDIR: /home/%i/tmp/autoscan
      HOME: /home/%i
    file:
      path: /home/%i/.krate/applications/autoscan.env
      mode: "0600"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/autoscan /home/%i/.config/autoscan
    start:
      - /opt/%i/autoscan/autoscan
      - --config=/home/%i/.config/autoscan/config.yml
      - --database=/home/%i/.config/autoscan/autoscan.db
      - --log=/home/%i/.config/autoscan/activity.log
files:
  service: /etc/systemd/system/autoscan@.service
  config:
    - /home/%i/.config/autoscan/config.yml
    - /home/%i/.krate/applications/autoscan.env
  database:
    - /home/%i/.config/autoscan/autoscan.db
  proxy:
    - /etc/caddy/softwares/%i.autoscan.caddy
  binary:
    - /opt/%i/autoscan/autoscan
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/autoscan
      - /home/%i/tmp/autoscan
      - /home/%i/.krate/backups/autoscan
      - /home/%i/.krate/applications
      - /home/%i/media
    read_only:
      - /opt/%i/autoscan
version:
  probes:
    - type: executable
      cmd: "{install_dir}/autoscan"
      args: --version
      requires: active
