id: decluttarr
name: Decluttarr
description: "Background worker (no web UI): cleans *arr queues and download clients. Configure config.yaml (*arr API keys and/or qBittorrent); logs via journalctl. Useless without at least one configured target."
source: https://github.com/ManiMatter/decluttarr
links:
  homepage: https://github.com/ManiMatter/decluttarr
  documentation: https://github.com/ManiMatter/decluttarr#readme
  source: https://github.com/ManiMatter/decluttarr
  krate_docs: https://runkrate.com/docs/software/official/decluttarr
tier: pro
category: automation
install_mode: local
autocomplete_options:
  - -b
ui_options:
  branches:
    options:
      - main
      - beta
    label: app.branch
  subdomain:
    enabled: false
    label: app.subdomain
