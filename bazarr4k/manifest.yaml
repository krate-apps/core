id: bazarr4k
multi_user: true
runtime:
  kind: systemd
  service_template: bazarr4k@.service
dependencies:
  apt:
    common:
      packages: git libxml2-dev libxmlsec1-dev liblzma-dev python3-pip python3-venv
install:
  layout:
    backup_dir: /home/%i/.krate/backups/bazarr4k
    data_dir: /home/%i/.config/bazarr4k
    install_dir: /opt/%i/bazarr4k
    temp_dir: /home/%i/tmp/bazarr4k
  release:
    asset: bazarr.zip
  executable:
    - /opt/%i/bazarr4k/bazarr.py
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
    KillSignal: SIGINT
    Restart: on-failure
    RestartSec: "5"
    UMask: "0002"
    WorkingDirectory: /opt/%i/bazarr4k
  environment:
    inline:
      TMPDIR: /home/%i/tmp/bazarr4k
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/bazarr4k /home/%i/.config/bazarr4k/config /home/%i/.config/bazarr4k/db /home/%i/.config/bazarr4k/log
    start:
      - /opt/%i/bazarr4k/.venv/bin/python
      - /opt/%i/bazarr4k/bazarr.py
      - --no-update
      - --config
      - /home/%i/.config/bazarr4k
files:
  service: /etc/systemd/system/bazarr4k@.service
  config:
    - /home/%i/.config/bazarr4k/config/config.yaml
  database:
    - /home/%i/.config/bazarr4k/db/bazarr4k.db
  proxy:
    - /etc/caddy/softwares/%i.bazarr4k.caddy
  binary:
    - /opt/%i/bazarr4k/bazarr.py
autogen:
  - apikey
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/bazarr4k
      - /home/%i/tmp/bazarr4k
      - /home/%i/.krate/backups/bazarr4k
    read_only:
      - /opt/%i/bazarr4k
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/system/status"
      field: data.bazarr_version
      auth: apikey
      auth_header: X-API-KEY
      requires: active
