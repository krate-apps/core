id: readarr
multi_user: true
runtime:
  kind: systemd
  service_template: readarr@.service
dependencies:
  apt:
    common:
      packages: mediainfo
install:
  layout:
    backup_dir: /home/%i/.krate/backups/readarr
    data_dir: /home/%i/.config/readarr
    install_dir: /opt/%i/readarr
    temp_dir: /home/%i/tmp/readarr
  release:
    # Readarr.develop.*.linux-core-x64.tar.gz (all published releases are prereleases)
    asset: linux-core-x64.tar.gz
    branches:
      main: develop
      beta: develop
  executable:
    - /opt/%i/readarr/Readarr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/readarr
    file:
      path: /home/%i/.krate/applications/readarr.env
      mode: "0600"
      variables:
        READARR__SERVER__BINDADDRESS: 127.0.0.1
        READARR__SERVER__PORT: "{default_port}"
        READARR__SERVER__URLBASE: "{url_base}"
        READARR__SERVER__ENABLESSL: "False"
        READARR__SERVER__SSLPORT: "{ssl_port}"
        READARR__AUTH__APIKEY: "{apikey}"
        READARR__UPDATE__BRANCH: "develop"
        READARR__APP__LAUNCHBROWSER: "False"
        READARR__APP__INSTANCENAME: "{instance_name}"
        READARR__LOG__ANALYTICSENABLED: "False"
        READARR__APP__THEME: dark
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/readarr
    start:
      - /opt/%i/readarr/Readarr
      - -nobrowser
      - -data=/home/%i/.config/readarr
files:
  service: /etc/systemd/system/readarr@.service
  config:
    - /home/%i/.krate/applications/readarr.env
  database:
    - /home/%i/.config/readarr/readarr.db
  proxy:
    - /etc/caddy/softwares/%i.readarr.caddy
  binary:
    - /opt/%i/readarr/Readarr
autogen:
  - apikey
  - default_port
  - ssl_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/readarr
      - /home/%i/tmp/readarr
      - /home/%i/.krate/backups/readarr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/readarr
version:
  probes:
    - type: http_json
      url: "http://127.0.0.1:{default_port}{root_url}/api/v1/system/status"
      field: version
      auth: apikey
      requires: active
  latest:
    probes:
      - type: http_json
        url: "http://127.0.0.1:{default_port}{root_url}/api/v1/update"
        field: "0.version"
        auth: apikey
        requires: active
