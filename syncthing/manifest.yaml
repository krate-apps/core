id: syncthing
multi_user: true
proxy:
  mode: strip_prefix
  portal_auth: true
  rewrite_location: true
runtime:
  kind: systemd
  service_template: syncthing@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates python3
install:
  layout:
    backup_dir: /home/%i/.krate/backups/syncthing
    data_dir: /home/%i/.config/syncthing
    install_dir: /opt/%i/syncthing
    temp_dir: /home/%i/.tmp/syncthing
  release:
    # Matches syncthing-linux-amd64-v*.tar.gz (not source / other arches).
    asset: syncthing-linux-amd64-
    branches:
      main: release
      beta: prerelease
  executable:
    - /opt/%i/syncthing/syncthing
systemd:
  unit:
    TimeoutStopSec: 30
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/syncthing
    BindPaths: /home/%i/.tmp/syncthing/index-v2:/home/%i/.config/syncthing/index-v2
  environment:
    inline:
      TMPDIR: /home/%i/.tmp/syncthing
      HOME: /home/%i
      STHOMEDIR: /home/%i/.config/syncthing
      STNOBROWSER: "1"
    file:
      path: /home/%i/.krate/applications/syncthing.env
      mode: "0600"
      variables:
        STGUIADDRESS: "127.0.0.1:{default_port}"
        STNOBROWSER: "1"
        STHOMEDIR: /home/%i/.config/syncthing
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/syncthing/index-v2 /home/%i/.config/syncthing/index-v2
    start:
      - /opt/%i/syncthing/syncthing
      - serve
      - --home=/home/%i/.config/syncthing
      - --gui-address=${STGUIADDRESS}
      - --no-browser
files:
  service: /etc/systemd/system/syncthing@.service
  config:
    - /home/%i/.krate/applications/syncthing.env
  proxy:
    - /etc/caddy/softwares/%i.syncthing.caddy
  binary:
    - /opt/%i/syncthing/syncthing
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/syncthing
      - /home/%i/.tmp/syncthing
      - /home/%i/.krate/backups/syncthing
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/syncthing
version:
  probes:
    - type: executable
      cmd: "{install_dir}/syncthing"
      args: --version
      requires: active
