id: muxarr
multi_user: true
runtime:
  kind: systemd
  service_template: muxarr@.service
dependencies:
  apt:
    common:
      packages: git curl ca-certificates wget build-essential mkvtoolnix ffmpeg
install:
  release:
    branches:
      main: master
      beta: master
  layout:
    backup_dir: /home/%i/.krate/backups/muxarr
    data_dir: /home/%i/.config/muxarr
    install_dir: /opt/%i/muxarr
    temp_dir: /home/%i/tmp/muxarr
  executable:
    - /opt/%i/muxarr/Muxarr.Web
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/muxarr
    # Upstream appsettings default Data Source=/config/muxarr.db
    BindPaths: /home/%i/.config/muxarr:/config:mkdir
  environment:
    inline:
      TMPDIR: /home/%i/tmp/muxarr
      HOME: /home/%i
      DOTNET_ROOT: /usr/share/dotnet
      PATH: /usr/share/dotnet:/usr/local/bin:/usr/bin:/bin
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /home/%i/tmp/muxarr
    file:
      path: /home/%i/.krate/applications/muxarr.env
      mode: "0600"
      variables:
        ASPNETCORE_URLS: "http://127.0.0.1:{default_port}"
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_HTTP_PORTS: "{default_port}"
        ConnectionStrings__DefaultConnection: "Data Source=/config/muxarr.db"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/muxarr /home/%i/.config/muxarr
    start:
      - /opt/%i/muxarr/Muxarr.Web
files:
  service: /etc/systemd/system/muxarr@.service
  config:
    - /home/%i/.krate/applications/muxarr.env
    - /home/%i/.config/muxarr/muxarr.db
  proxy:
    - /etc/caddy/softwares/%i.muxarr.caddy
  binary:
    - /opt/%i/muxarr/Muxarr.Web
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/muxarr
      - /home/%i/tmp/muxarr
      - /home/%i/.krate/backups/muxarr
      - /home/%i/.krate/applications
      - /opt/%i/muxarr
      - /config
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/Muxarr.Web.dll"
