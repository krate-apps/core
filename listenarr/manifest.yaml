id: listenarr
multi_user: true
runtime:
  kind: systemd
  service_template: listenarr@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates
install:
  layout:
    backup_dir: /home/%i/.krate/backups/listenarr
    data_dir: /home/%i/.config/listenarr
    install_dir: /opt/%i/listenarr
    temp_dir: /home/%i/tmp/listenarr
  release:
    # Matches listenarr-*-linux-x64.zip (canary/prerelease assets)
    asset: linux-x64.zip
  executable:
    - /opt/%i/listenarr/Listenarr.Api
systemd:
  unit:
    TimeoutStopSec: 40
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    WorkingDirectory: /opt/%i/listenarr
  environment:
    inline:
      TMPDIR: /home/%i/tmp/listenarr
      HOME: /home/%i
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /home/%i/tmp/listenarr
    file:
      path: /home/%i/.krate/applications/listenarr.env
      mode: "0600"
      variables:
        ASPNETCORE_URLS: "http://127.0.0.1:{default_port}"
        ASPNETCORE_ENVIRONMENT: Production
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/listenarr /home/%i/.config/listenarr/config
    start:
      - /opt/%i/listenarr/Listenarr.Api
files:
  service: /etc/systemd/system/listenarr@.service
  config:
    - /home/%i/.krate/applications/listenarr.env
  proxy:
    - /etc/caddy/softwares/%i.listenarr.caddy
  binary:
    - /opt/%i/listenarr/Listenarr.Api
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/listenarr
      - /home/%i/tmp/listenarr
      - /home/%i/.krate/backups/listenarr
      - /home/%i/.krate/applications
      - /opt/%i/listenarr
    read_only: []
version:
  probes:
    - type: file
      path: "{install_dir}/Listenarr.Api"
