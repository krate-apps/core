id: tdarr
multi_user: true
proxy:
  mode: strip_prefix
  portal_auth: true
  rewrite_location: true
runtime:
  kind: systemd
  service_template: tdarr@.service
dependencies:
  apt:
    common:
      packages: curl ca-certificates unzip ffmpeg libatomic1 libtesseract5 handbrake-cli
install:
  layout:
    backup_dir: /home/%i/.krate/backups/tdarr
    data_dir: /home/%i/.config/tdarr
    install_dir: /opt/%i/tdarr
    temp_dir: /home/%i/.tmp/tdarr
  release:
    # Primary: storage.tdarr.io (versions.json + zip). Fallback: GitHub Tdarr-Linux via release::get.
    base: https://storage.tdarr.io/
    asset: Tdarr-Linux
    branches:
      main: master
  executable:
    - /opt/%i/tdarr/Tdarr_Server/Tdarr_Server
systemd:
  unit:
    TimeoutStopSec: 60
    Type: simple
    Restart: on-failure
    RestartSec: "10"
    KillMode: process
    WorkingDirectory: /opt/%i/tdarr/Tdarr_Server
  environment:
    inline:
      TMPDIR: /home/%i/.tmp/tdarr
      HOME: /home/%i
      serverBindIP: "true"
      openBrowser: "false"
    file:
      path: /home/%i/.krate/applications/tdarr.env
      mode: "0600"
      variables:
        webUIPort: "{default_port}"
  exec:
    pre:
      - /bin/mkdir -p /home/%i/.tmp/tdarr /home/%i/.config/tdarr/configs /home/%i/.config/tdarr/logs /home/%i/.config/tdarr/server
    start:
      - /opt/%i/tdarr/Tdarr_Server/Tdarr_Server
files:
  service: /etc/systemd/system/tdarr@.service
  config:
    - /home/%i/.krate/applications/tdarr.env
    - /home/%i/.config/tdarr/configs/Tdarr_Server_Config.json
  proxy:
    - /etc/caddy/softwares/%i.tdarr.caddy
  binary:
    - /opt/%i/tdarr/Tdarr_Server/Tdarr_Server
    - /opt/%i/tdarr/Tdarr_Server/runtime/Tdarr_Server_Runtime
autogen:
  - default_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/tdarr
      - /home/%i/.tmp/tdarr
      - /home/%i/.krate/backups/tdarr
      - /home/%i/.krate/applications
      - /opt/%i/tdarr
    read_only: []
version:
  probes:
    - type: file
      path: "{data_dir}/VERSION"
