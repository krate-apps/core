id: prowlarr
multi_user: true
runtime:
  kind: systemd
  service_template: prowlarr@.service
install:
  layout:
    backup_dir: /home/%i/.krate/backups/prowlarr
    data_dir: /home/%i/.config/prowlarr
    install_dir: /opt/%i/prowlarr
    temp_dir: /home/%i/tmp/prowlarr
  release:
    asset: linux-core-x64.tar.gz
    update_branch:
      stable: master
      prerelease: develop
  executable:
    - /opt/%i/prowlarr/Prowlarr
systemd:
  unit:
    TimeoutStopSec: 20
    Type: simple
  environment:
    inline:
      TMPDIR: /home/%i/tmp/prowlarr
    file:
      path: /home/%i/.krate/applications/prowlarr.env
      mode: "0600"
      variables:
        PROWLARR__SERVER__BINDADDRESS: 127.0.0.1
        PROWLARR__SERVER__PORT: "{default_port}"
        PROWLARR__SERVER__URLBASE: "{url_base}"
        PROWLARR__SERVER__ENABLESSL: "False"
        PROWLARR__SERVER__SSLPORT: "{ssl_port}"
        PROWLARR__AUTH__APIKEY: "{apikey}"
        PROWLARR__UPDATE__BRANCH: "master"
        PROWLARR__APP__LAUNCHBROWSER: "False"
        PROWLARR__APP__INSTANCENAME: "{instance_name}"
        PROWLARR__LOG__ANALYTICSENABLED: "False"
        PROWLARR__APP__THEME: dark
  exec:
    pre:
      - /bin/mkdir -p /home/%i/tmp/prowlarr
    start:
      - /opt/%i/prowlarr/Prowlarr
      - -nobrowser
      - -data=/home/%i/.config/prowlarr
files:
  service: /etc/systemd/system/prowlarr@.service
  config:
    - /home/%i/.krate/applications/prowlarr.env
  database:
    - /home/%i/.config/prowlarr/prowlarr.db
  proxy:
    - /etc/caddy/softwares/%i.prowlarr.caddy
  binary:
    - /opt/%i/prowlarr/Prowlarr
autogen:
  - apikey
  - default_port
  - ssl_port
security:
  network: true
  filesystem:
    read_write:
      - /home/%i/.config/prowlarr
      - /home/%i/tmp/prowlarr
      - /home/%i/.krate/backups/prowlarr
      - /home/%i/.krate/applications
    read_only:
      - /opt/%i/prowlarr
